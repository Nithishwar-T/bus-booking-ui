<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-5">

      <div class="card shadow">

        <div class="card-header text-center">

          <h3>Bus Booking Registration</h3>

        </div>

        <div class="card-body">

          <div class="mb-3">

            <label>First Name</label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="firstName">

          </div>

          <div class="mb-3">

            <label>Last Name</label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="lastName">

          </div>

          <div class="mb-3">

            <label>Email</label>

            <input
              type="email"
              class="form-control"
              [(ngModel)]="email">

          </div>

          <div class="mb-3">

            <label>Phone Number</label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="phoneNumber">

          </div>

          <div class="mb-3">

            <label>Password</label>

            <input
              type="password"
              class="form-control"
              [(ngModel)]="password">

          </div>

          <button
            class="btn btn-success w-100"
            (click)="register()">

            Register

          </button>

          <div class="text-center mt-3">

            <a routerLink="/login">
              Already have an account? Login
            </a>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
